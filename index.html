		<style>
			* {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}

			body {
				font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
				background-image: linear-gradient(0deg, #eee 1px, transparent 0),
					linear-gradient(90deg, #eee 1px, transparent 0);
				background-size: 30px 30px;
				color: #333;
				min-height: 100dvh;
				overflow: hidden;
			}

			body.is-mobile {
				overflow-y: auto;
			}

			#board {
				position: relative;
				width: 100vw;
				height: 100dvh;
				overflow: hidden;
			}

			body.is-mobile #board {
				height: auto;
				min-height: 100dvh;
			}

			.card {
				position: absolute;
				width: 220px;
				border-radius: 12px;
				box-shadow: 0 16px 35px rgba(0, 0, 0, 0.2);
				background: #fff;
				border: 1px solid rgba(0, 0, 0, 0.08);
				overflow: hidden;
				opacity: 0;
				transform-origin: center;
				transition: transform 0.35s ease, opacity 0.35s ease, left 0.35s ease,
					top 0.35s ease, width 0.35s ease, height 0.35s ease,
					border-radius 0.35s ease;
			}

			.card.dragging {
				transition: none;
				box-shadow: 0 22px 45px rgba(0, 0, 0, 0.35);
			}

			.card.maximized {
				box-shadow: 0 28px 60px rgba(0, 0, 0, 0.4);
			}

			.card-header {
				display: flex;
				align-items: center;
				justify-content: space-between;
				padding: 10px 12px;
				background: rgba(255, 255, 255, 0.7);
				cursor: grab;
				user-select: none;
				touch-action: pan-y;
			}

			.card-header.dragging {
				cursor: grabbing;
			}

			.window-controls {
				display: flex;
				align-items: center;
				gap: 6px;
			}

			.window-controls .control {
				position: relative;
				width: 12px;
				height: 12px;
				border-radius: 50%;
				border: 1px solid rgba(0, 0, 0, 0.08);
				background: #ccc;
				cursor: pointer;
				outline: none;
				padding: 0;
				display: inline-flex;
				align-items: center;
				justify-content: center;
			}

			.window-controls .control.close {
				background: #ff5f57;
				border-color: #e0443e;
			}

			.window-controls .control.minimize {
				background: #febb2e;
				border-color: #dea123;
			}

			.window-controls .control.maximize {
				background: #28c840;
				border-color: #1aab2c;
			}

			.window-controls .control::after {
				content: '';
				position: absolute;
				top: 50%;
				left: 50%;
				transform: translate(-50%, -50%);
				opacity: 0;
				transition: opacity 0.2s ease;
			}

			.card-header:hover .window-controls .control::after {
				opacity: 0.8;
			}

			.window-controls .control.close::after {
				content: '×';
				width: auto;
				height: auto;
				background: none;
				font-size: 10px;
				line-height: 1;
				font-weight: 700;
				color: rgba(0, 0, 0, 0.7);
			}

			.window-controls .control.minimize::after {
				width: 6px;
				height: 2px;
				background: rgba(0, 0, 0, 0.6);
			}

			.window-controls .control.maximize::after {
				width: 6px;
				height: 6px;
				background: linear-gradient(
					45deg,
					rgba(0, 0, 0, 0.6) 0%,
					rgba(0, 0, 0, 0.6) 45%,
					transparent 45%,
					transparent 55%,
					rgba(0, 0, 0, 0.6) 55%,
					rgba(0, 0, 0, 0.6) 100%
				);
			}

			.card-title {
				font-size: 13px;
				font-weight: 600;
				color: rgba(0, 0, 0, 0.55);
				padding-left: 10px;
				flex: 1;
			}

			.card-body {
				padding: 16px;
				font-size: 16px;
				line-height: 1.4;
				font-weight: 600;
				color: rgba(0, 0, 0, 0.72);
			}

			@media (max-width: 768px) {
				.card {
					width: 180px;
					border-radius: 10px;
				}

				.card-body {
					padding: 14px;
					font-size: 14px;
				}

				.card-title {
					font-size: 12px;
				}
			}
		</style>

		<script>
			const bgm = document.getElementById('bgm');
			const modal = document.getElementById('musicModal');

			// 页面加载时展示弹窗
			modal.style.display = 'flex';

			function showWelcome() {
				const prefersReduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
			
				const style = document.createElement('style');
				style.textContent = `
				@keyframes wobble { from { transform: translateY(0) rotate(-1deg); } to { transform: translateY(-2px) rotate(1.2deg); } }
				`;
				document.head.appendChild(style);
			
				const overlay = document.createElement('div');
				overlay.style.position = 'fixed';
				overlay.style.inset = '0';
				overlay.style.display = 'flex';
				overlay.style.alignItems = 'center';
				overlay.style.justifyContent = 'center';
				overlay.style.pointerEvents = 'none';
				overlay.style.zIndex = '1000002';
			
				// 柔焦半透明“气泡”底板，提升可读性且更卡通
				const plate = document.createElement('div');
				plate.style.position = 'relative';
				plate.style.padding = '0.25em 0.55em';
				plate.style.borderRadius = '28px';
				plate.style.background = 'rgba(255,255,255,0.18)';
				plate.style.backdropFilter = 'blur(4px) saturate(120%)';
				plate.style.boxShadow = '0 12px 28px rgba(255,150,210,0.25), 0 8px 18px rgba(255,126,219,0.22)';
			
				const container = document.createElement('div');
				container.style.display = 'inline-block';
				container.style.fontFamily = "'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Trebuchet MS', 'Segoe UI', system-ui, -apple-system, sans-serif";
				container.style.fontWeight = '900';
				container.style.fontSize = 'clamp(34px, 9vw, 110px)';
				container.style.letterSpacing = '0.02em';
				// 白描边 + 彩色发光 + 明亮渐变，更动漫卡通
				container.style.backgroundImage = 'linear-gradient(135deg, #ff6fae 0%, #ff9acb 50%, #ffd1e8 100%)';
				container.style.backgroundClip = 'text';
				container.style.webkitBackgroundClip = 'text';
				container.style.color = 'transparent';
				container.style.webkitTextStroke = '2px rgba(255,255,255,0.90)';
				container.style.textShadow = [
					'0 0 8px rgba(255,160,220,0.60)',
					'0 0 16px rgba(255,126,219,0.45)',
					'0 6px 18px rgba(0,0,0,0.20)'
				].join(', ');
			
				const text = '欢迎敏宝宝观看';
				const chars = Array.from(text);
			
				chars.forEach((ch, i) => {
					const span = document.createElement('span');
					span.textContent = ch;
					span.style.display = 'inline-block';
					span.style.opacity = '0';
					span.style.transform = 'translateY(16px) scale(0.88)';
					span.style.filter = 'blur(2px)';
					span.style.transition = 'opacity 1100ms ease, transform 1100ms cubic-bezier(0.16, 1, 0.3, 1), filter 1100ms ease';
					// 轻柔彩色光晕，避免厚重的黑色轮廓
					span.style.textShadow = [
						'0 0 6px rgba(255,160,220,0.45)',
						'0 0 10px rgba(255,126,219,0.32)'
					].join(', ');
					container.appendChild(span);
			
					if (!prefersReduce) {
						setTimeout(() => {
							span.style.opacity = '1';
							span.style.transform = 'translateY(0) scale(1)';
							span.style.filter = 'blur(0)';
							span.style.animation = 'wobble 1.8s ease-in-out infinite alternate';
							span.style.animationDelay = (600 + i * 90) + 'ms';
						}, 120 + i * 120);
					} else {
						span.style.opacity = '1';
						span.style.transform = 'none';
						span.style.filter = 'none';
					}
				});
			
				plate.appendChild(container);
				overlay.appendChild(plate);
				document.body.appendChild(overlay);
			
				const totalReveal = prefersReduce ? 0 : (120 + (chars.length - 1) * 120 + 1100);
				const hold = 1800;
			
				setTimeout(() => {
					plate.style.transition = 'opacity 1400ms ease, transform 1400ms ease, filter 1400ms ease';
					plate.style.opacity = '0';
					plate.style.transform = 'translateY(-6px) scale(0.98)';
					plate.style.filter = 'blur(1px)';
					plate.addEventListener('transitionend', () => {
						overlay.remove();
						style.remove();
					}, { once: true });
				}, totalReveal + hold);
			}

			confirmBtn.addEventListener('click', () => {
				// 展示欢迎文字动画
				showWelcome();
				// 进入全屏（需用户点击手势触发）
				const root = document.documentElement;
				if (!document.fullscreenElement && root.requestFullscreen) {
					root.requestFullscreen({ navigationUI: 'hide' }).catch(() => {});
				}

				// 播放背景音乐
				bgm.play().then(() => {
					modal.remove();
				}).catch(() => {
					// 播放失败则保留弹窗以便用户再次点击
				});
			});
		</script>


		<script>
			const board = document.getElementById('board')
			const messages = [
				'每天保持好心情',
				'敏宝天天开心~',
				'我喜欢晴天 你恰好是太阳≥^⦁𖥦⦁^≤',

				'今天辛苦啦',
				'无忧无虑 平安顺遂 幸福快乐 好运常在！！！',
				'记得吃水果',
				'不遮掩 很想你՞˶･֊･˶՞',
				'小猫呆呆的 像你՞˶･֊･˶՞',
				'愿所有烦恼都消失',
				'期待下一次见面',
				'你 我的全世界˶˃ ᵕ ˂˶',
				'我喜欢你',
				'多喜乐，长安宁，岁无忧',
				'天气冷了，多穿衣服',
				'小得盈满，爱逢其时',
				'我遇你如枯木逢春˶˃ ᵕ ˂˶',
				'今天也要好好爱自己',
				'记得想我哦'

			]

			const colors = [
				'#ffe0e3',
				'#c7f0ff',
				'#ffd8a8',
				'#d9f2d9',
				'#e5d7ff',
				'#f9f7d9',
				'#d2f0f8',
				'#ffd4f5'
			]

			const cardStates = new WeakMap()
			// Reserve a very high层级给全屏卡片，避免被后续元素覆盖
			const MAXIMIZED_LAYER = 1000000
			let activeMaximizedCard = null
			let isMobile =
				window.matchMedia('(pointer: coarse)').matches ||
				window.innerWidth <= 768
			const maxCards = isMobile ? 120 : 180 // 限制 DOM 节点数量，减轻移动端压力
			const initialCardCount = isMobile ? 18 : 30
			const spawnInterval = isMobile ? 700 : 400
			let zIndexCursor = 200

			document.body.classList.toggle('is-mobile', isMobile)

			function randomFrom(array) {
				return array[Math.floor(Math.random() * array.length)]
			}

			function clamp(value, min, max) {
				return Math.min(Math.max(value, min), max)
			}

			function applyTransform(card, state) {
				const scale = state.scale ?? 1
				const translateX = state.translateX ?? 0
				const translateY = state.translateY ?? 0
				const angle = state.angle ?? 0
				card.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale}) rotate(${angle}deg)`
			}

			function bringToFront(card) {
				if (card === activeMaximizedCard) {
					card.style.zIndex = MAXIMIZED_LAYER
					return
				}

				zIndexCursor += 1
				if (activeMaximizedCard && zIndexCursor >= MAXIMIZED_LAYER) {
					zIndexCursor = MAXIMIZED_LAYER - 1
				}

				card.style.zIndex = zIndexCursor
			}

			function setupCardInteractions(card) {
				const header = card.querySelector('.card-header')
				const closeBtn = card.querySelector('.control.close')
				const minimizeBtn = card.querySelector('.control.minimize')
				const maximizeBtn = card.querySelector('.control.maximize')

				closeBtn.addEventListener('click', event => {
					event.stopPropagation()
					closeCard(card)
				})

				minimizeBtn.addEventListener('click', event => {
					event.stopPropagation()
					minimizeCard(card)
				})

				maximizeBtn.addEventListener('click', event => {
					event.stopPropagation()
					toggleMaximize(card)
				})

				header.addEventListener('pointerdown', event => {
					if (event.pointerType === 'touch') return
					startDrag(event, card)
				})

				card.addEventListener('pointerdown', () => {
					bringToFront(card)
				})

				header.addEventListener('dblclick', event => {
					if (!event.target.closest('.control')) {
						toggleMaximize(card)
					}
				})
			}

			function closeCard(card) {
				const state = cardStates.get(card)
				if (!state || state.closing) return
				if (card === activeMaximizedCard) {
					activeMaximizedCard = null
				}
				state.closing = true
				state.scale = 0.1
				card.style.opacity = '0'
				applyTransform(card, state)

				const handleTransitionEnd = event => {
					if (event.propertyName === 'opacity') {
						card.removeEventListener('transitionend', handleTransitionEnd)
						card.remove()
					}
				}

				card.addEventListener('transitionend', handleTransitionEnd)
			}

			function minimizeCard(card) {
				const state = cardStates.get(card)
				if (!state || state.closing) return

				// 最小化动画：缩小并淡出到底部，结束时移除节点释放内存
				const runMinimize = () => {
					state.closing = true
					bringToFront(card)
					const bottom = Math.max(window.innerHeight - 24, 0)
					const targetLeft = clamp(
						state.left,
						16,
						Math.max(window.innerWidth - card.offsetWidth - 16, 16)
					)

					state.left = targetLeft
					state.top = bottom
					state.scale = 0.1
					state.angle = 0
					card.style.left = `${targetLeft}px`
					card.style.top = `${bottom}px`
					card.style.opacity = '0.35'
					applyTransform(card, state)

					const handleTransitionEnd = event => {
						if (event.propertyName === 'transform') {
							card.removeEventListener('transitionend', handleTransitionEnd)
							card.remove()
						}
					}

					card.addEventListener('transitionend', handleTransitionEnd)
				}

				if (state.maximized) {
					activeMaximizedCard = null
					state.maximized = false
					card.classList.remove('maximized')
					card.style.borderRadius = '12px'
					state.left = 0
					state.top = 0
					state.scale = 1
					state.angle = 0
					applyTransform(card, state)

					requestAnimationFrame(() => {
						requestAnimationFrame(runMinimize)
					})
					return
				}

				runMinimize()
			}

			function toggleMaximize(card) {
				const state = cardStates.get(card)
				if (!state || state.closing) return

				if (state.maximized) {
					restoreFromMaximize(card, state)
				} else {
					maximizeCard(card, state)
				}
			}

			function maximizeCard(card, state) {
				state.beforeMaximize = {
					left: state.left,
					top: state.top,
					scale: state.scale ?? 1,
					width: card.offsetWidth,
					height: card.offsetHeight,
					angle: state.angle ?? 0
				}

				card.classList.add('maximized')
				card.style.left = '0px'
				card.style.top = '0px'
				card.style.width = `${window.innerWidth}px`
				card.style.height = `${window.innerHeight}px`
				card.style.borderRadius = '0'

				state.left = 0
				state.top = 0
				state.scale = 1
				state.angle = 0
				applyTransform(card, state)
				activeMaximizedCard = card
				bringToFront(card)
				state.maximized = true
			}

			function restoreFromMaximize(card, state) {
				const previous = state.beforeMaximize
				if (!previous) return

				card.classList.remove('maximized')
				card.style.left = `${previous.left}px`
				card.style.top = `${previous.top}px`
				card.style.width = `${previous.width}px`
				card.style.height = `${previous.height}px`
				card.style.borderRadius = '12px'

				state.left = previous.left
				state.top = previous.top
				state.scale = previous.scale ?? 1
				state.angle = previous.angle ?? state.angle ?? 0
				applyTransform(card, state)
				state.maximized = false
				if (activeMaximizedCard === card) {
					activeMaximizedCard = null
				}
				bringToFront(card)
				state.lastPosition = { left: state.left, top: state.top }

				setTimeout(() => {
					if (!state.maximized) {
						card.style.width = ''
						card.style.height = ''
						state.width = card.offsetWidth
						state.height = card.offsetHeight
					}
				}, 360)
			}

			function startDrag(event, card) {
				const control = event.target.closest('.control')
				if (control) return

				const state = cardStates.get(card)
				if (!state || state.closing || state.maximized) return

				// 鼠标拖拽使用 rAF 节流，避免频繁触发布局计算
				event.preventDefault()
				bringToFront(card)

				const header = card.querySelector('.card-header')
				card.classList.add('dragging')
				header.classList.add('dragging')

				state.dragging = true
				state.dragOffsetX = event.clientX - state.left
				state.dragOffsetY = event.clientY - state.top

				let dragFrame = null
				let pendingLeft = state.left
				let pendingTop = state.top

				const commitDrag = () => {
					dragFrame = null
					const maxLeft = Math.max(window.innerWidth - card.offsetWidth, 0)
					const maxTop = Math.max(window.innerHeight - card.offsetHeight, 0)
					state.left = clamp(pendingLeft, -card.offsetWidth * 0.4, maxLeft)
					state.top = clamp(pendingTop, -card.offsetHeight * 0.4, maxTop)
					card.style.left = `${state.left}px`
					card.style.top = `${state.top}px`
				}

				const handlePointerMove = moveEvent => {
					if (!state.dragging) return

					pendingLeft = moveEvent.clientX - state.dragOffsetX
					pendingTop = moveEvent.clientY - state.dragOffsetY
					if (dragFrame === null) {
						dragFrame = requestAnimationFrame(commitDrag)
					}
				}

				const handlePointerUp = () => {
					state.dragging = false
					state.lastPosition = { left: state.left, top: state.top }
					card.classList.remove('dragging')
					header.classList.remove('dragging')
					if (dragFrame !== null) {
						cancelAnimationFrame(dragFrame)
						commitDrag()
					}
					document.removeEventListener('pointermove', handlePointerMove)
					document.removeEventListener('pointerup', handlePointerUp)
				}

				document.addEventListener('pointermove', handlePointerMove)
				document.addEventListener('pointerup', handlePointerUp)
			}

			function createCard() {
				const card = document.createElement('div')
				card.className = 'card'

				const color = randomFrom(colors)
				const angleRange = isMobile ? 6 : 10
				const angle = (Math.random() - 0.5) * angleRange
				const cardWidth = isMobile ? 180 : 220
				const cardHeight = isMobile ? 130 : 140
				const horizontalMargin = isMobile ? 12 : 16
				const verticalMargin = isMobile ? 12 : 20
				const left =
					horizontalMargin +
					Math.random() *
						Math.max(window.innerWidth - cardWidth - horizontalMargin * 2, 0)
				const top =
					verticalMargin +
					Math.random() *
						Math.max(window.innerHeight - cardHeight - verticalMargin * 2, 0)

				card.style.background = color
				card.style.left = `${left}px`
				card.style.top = `${top}px`
				if (activeMaximizedCard && zIndexCursor >= MAXIMIZED_LAYER - 2) {
					zIndexCursor = MAXIMIZED_LAYER - 2
				}
				card.style.zIndex = ++zIndexCursor

				card.innerHTML = `
					<div class="card-header">
						<div class="window-controls">
							<button class="control close" type="button" aria-label="关闭"></button>
							<button class="control minimize" type="button" aria-label="最小化"></button>
							<button class="control maximize" type="button" aria-label="最大化"></button>
						</div>
						<div class="card-title">温馨提示:</div>
					</div>
					<div class="card-body">${randomFrom(messages)}</div>
				`

				const state = {
					angle,
					scale: isMobile ? 0.85 : 0.7,
					translateX: 0,
					translateY: 0,
					left,
					top,
					maximized: false,
					closing: false,
					lastPosition: { left, top }
				}

				cardStates.set(card, state)
				applyTransform(card, state)
				board.appendChild(card)

				state.width = card.offsetWidth
				state.height = card.offsetHeight

				requestAnimationFrame(() => {
					state.scale = 1
					applyTransform(card, state)
					card.style.opacity = '1'
				})

				setupCardInteractions(card)

				if (board.children.length > maxCards) {
					const oldest = board.firstElementChild
					if (oldest && oldest !== card) {
						oldest.remove()
					}
				}
			}

			for (let i = 0; i < initialCardCount; i++) {
				setTimeout(createCard, i * (isMobile ? 60 : 40))
			}

			setInterval(() => {
				createCard()
			}, spawnInterval)

			window.addEventListener('resize', () => {
				isMobile =
					window.matchMedia('(pointer: coarse)').matches ||
					window.innerWidth <= 768
				// 视口变化时重新切换移动端模式，并同步全屏卡片的宽高
				document.body.classList.toggle('is-mobile', isMobile)

				document.querySelectorAll('.card.maximized').forEach(card => {
					card.style.width = `${window.innerWidth}px`
					card.style.height = `${window.innerHeight}px`
				})
			})
		</script>
	</body>
</html>
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <title>飘落动漫爱心效果</title>
    <style>
        /* 覆盖层容器 */
        #hearts-container {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 9999;
        }

        /* 心形元素：用一个方块加两个圆组合成心形 */
        .heart {
            position: absolute;
            top: -10vh;
            left: 50%;
            width: var(--size, 18px);
            height: var(--size, 18px);
            background: var(--color, #ff6f91);
            transform: rotate(-45deg);
            filter: drop-shadow(0 1px 2px rgba(0,0,0,.12));
            animation: fall var(--duration, 8s) linear var(--delay, 0s) forwards;
            opacity: 0;
        }

        .heart::before, .heart::after {
            content: "";
            position: absolute;
            width: var(--size, 18px);
            height: var(--size, 18px);
            background: var(--color, #ff6f91);
            border-radius: 50%;
        }
        /* 左上圆 */
        .heart::before {
            top: calc(var(--size, 18px) * -0.5);
            left: 0;
        }
        /* 右上圆 */
        .heart::after {
            top: 0;
            left: calc(var(--size, 18px) * 0.5);
        }

        /* 下落动画：带旋转和轻微缩放，营造“动漫感” */
        @keyframes fall {
            0% {
                transform: translateY(-10vh) rotate(-45deg) scale(0.9);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            50% {
                transform: translateY(50vh) rotate(135deg) scale(1.05);
                opacity: 1;
            }
            100% {
                transform: translateY(110vh) rotate(315deg) scale(1.15);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div id="hearts-container"></div>

    <script>
        (function () {
            const container = document.getElementById('hearts-container');

            // 可自行修改的颜色组（偏“动漫粉”）
            const colors = [
                '#ff4d6d', '#ff6f91', '#ff85a1', '#ff99cc',
                '#fc2b64', '#f05475', '#e94057', '#fda4af'
            ];

            // 调整频率和并发数量
            const density = 280; // 心生成的时间间隔（毫秒）
            const maxHearts = 60; // 同时最多存在的心形数量

            let liveHearts = 0;

            function spawnHeart() {
                const heart = document.createElement('div');
                heart.className = 'heart';

                // 随机大小、颜色、位置、时长与延迟
                const size = 12 + Math.random() * 20;           // 12px ~ 32px
                const duration = 6 + Math.random() * 6;         // 6s ~ 12s
                const delay = -Math.random() * 3;               // 负延迟，打散起始相位
                const leftPercent = Math.random() * 100;        // 0% ~ 100%
                const color = colors[Math.floor(Math.random() * colors.length)];

                heart.style.setProperty('--size', size + 'px');
                heart.style.setProperty('--color', color);
                heart.style.setProperty('--duration', duration + 's');
                heart.style.setProperty('--delay', delay + 's');
                heart.style.left = leftPercent + '%';

                container.appendChild(heart);
                liveHearts++;

                // 在动画结束后移除 DOM，避免堆积
                const life = (duration) * 1000;
                setTimeout(() => {
                    heart.remove();
                    liveHearts--;
                }, life + 1000);
            }

            // 定时生成
            const timer = setInterval(() => {
                if (liveHearts < maxHearts) {
                    spawnHeart();
                }
            }, density);

            // 交互：点击屏幕触发一小波“连发”
            window.addEventListener('click', () => {
                const burst = 10;
                for (let i = 0; i < burst; i++) {
                    setTimeout(spawnHeart, i * 70);
                }
            });
        })();
    </script>
    </body>
</html>
